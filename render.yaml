# Deployment: Render Blueprint for the FastAPI backend and Postgres database.
# Set CORS_ORIGINS to your Vercel frontend URL (comma-separated if multiple).

services:
  - type: web
    name: aivoa-crm-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aivoa-crm-db
          property: connectionString

databases:
  - name: aivoa-crm-db
    plan: free
    databaseName: crm_db
    user: crm_user
